---
- name: Ensure DevOps repo exists (clone if missing)
  when: reach_var | default('') != 'molecule_converge'
  tags:
    - reach
    - reach-repos
    - repositories
    - git
  block:
    - name: Check if DevOps repo is present
      ansible.builtin.stat:
        path: "{{ reach_base_dir }}/.git"
      register: devops_repo_gitdir
      become: false

    - name: Clone DevOps repository
      ansible.builtin.git:
        repo: "{{ reach_devops_repo_url }}"
        dest: "{{ reach_base_dir }}"
        version: "{{ reach_devops_repo_branch }}"
        update: false
        accept_hostkey: true
        key_file: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519"
      register: devops_clone_result
      become: false
      # environment:
      #   SSH_AUTH_SOCK: "{{ ssh_auth_sock | default(ansible_env.SSH_AUTH_SOCK) }}"
      #   SSH_AGENT_PID: "{{ ssh_agent_pid | default(ansible_env.SSH_AGENT_PID) }}"
      when: not devops_repo_gitdir.stat.exists
      ignore_errors: true

- name: Check for new repositories to clone
  when:
    - reach_var | default('') != 'molecule_converge'
    - (devops_clone_result.failed | default(false)) != true
  block:
    - name: Check for new repositories to clone
      ansible.builtin.shell: |
        cd {{ reach_dev_dir }}
        REPOS=$(cat repos.txt)
        NEW_REPOS_FOUND=false

        for R in $REPOS; do
          if [ ! -d {{ reach_repos_dir }}/$R ]; then
            echo "New repository found: $R"
            NEW_REPOS_FOUND=true
          fi
        done

        if [ "$NEW_REPOS_FOUND" = "true" ]; then
          echo "NEW_REPOS_TO_CLONE"
        else
          echo "ALL_REPOS_EXIST"
        fi
      register: repo_check
      become: false
      changed_when: false
      when: reach_var | default('') != 'molecule_converge'

    - name: Debug
      ansible.builtin.debug:
        var: repo_check

    - name: Retrieve required repositories
      ansible.builtin.command: "{{ reach_repo_script }} dev"
      args:
        chdir: "{{ reach_base_dir }}"
      register: repos_output
      changed_when: "'NEW_REPOS_TO_CLONE' in repo_check.stdout"
      become: false
      # environment:
      #   SSH_AUTH_SOCK: "{{ ssh_auth_sock | default(ansible_env.SSH_AUTH_SOCK) }}"
      #   SSH_AGENT_PID: "{{ ssh_agent_pid | default(ansible_env.SSH_AGENT_PID) }}"
      when: reach_var | default('') != 'molecule_converge'
      ignore_errors: true

    - name: Copy .env example
      ansible.builtin.copy:
        src: "{{ reach_env_example }}"
        dest: "{{ reach_env_file }}"
        backup: true
        remote_src: true
        mode: "0644"
        owner: "{{ lookup('env', 'USER') }}"
      when:
        - reach_var | default('') != 'molecule_converge'

    - name: Copy local config file
      ansible.builtin.copy:
        src: "{{ reach_config_local_sample }}"
        dest: "{{ reach_config_local }}"
        backup: true
        remote_src: true
        mode: "0644"
        owner: "{{ lookup('env', 'USER') }}"
      when:
        - reach_var | default('') != 'molecule_converge'

    - name: Create VSCode directories
      ansible.builtin.file:
        path: "{{ reach_vscode_user_dir }}"
        state: directory
        mode: "0755"
        owner: "{{ lookup('env', 'USER') }}"
      when: reach_var | default('') != 'molecule_converge'

    - name: Copy default VSCode settings
      ansible.builtin.copy:
        src: "{{ reach_vscode_settings_example }}"
        dest: "{{ reach_vscode_settings }}"
        backup: true
        remote_src: true
        mode: "0755"
        owner: "{{ lookup('env', 'USER') }}"
      when:
        - reach_var | default('') != 'molecule_converge'

    - name: Check if pre-commit hook already present
      ansible.builtin.stat:
        path: "{{ reach_v2_dir }}/.git/hooks/pre-commit"
      register: hook
      when: reach_var | default('') != 'molecule_converge'

    # - name: Install pre-commit via pip3
    #   ansible.builtin.pip:
    #     name: pre-commit
    #     state: latest
    #     executable: pip3
    #   when: not hook.stat.exists
