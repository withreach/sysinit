---
- name: Create sudoers rule for reach development hosts
  ansible.builtin.copy:
    content: |
      # Allow user to modify /etc/hosts without password for reach development
      {{ lookup('env', 'USER') }} ALL=(ALL) NOPASSWD: /usr/bin/tee -a /etc/hosts
      {{ lookup('env', 'USER') }} ALL=(ALL) NOPASSWD: /usr/bin/sed -i * /etc/hosts
    dest: "{{ reach_sudoers_file }}"
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
    backup: "{{ reach_sudoers_backup }}"
  become: true
  tags:
    - reach
    - reach-sudo
    - sudoers
    - security
