---
- name: Check if mkcert is installed
  become: false
  ansible.builtin.command: which mkcert
  register: mkcert_check
  failed_when: false
  changed_when: false

- name: Fail if mkcert is not installed
  ansible.builtin.fail:
    msg: "mkcert is not installed or not in PATH. Please install mkcert before running this role."
  when: mkcert_check.rc != 0

- name: Create SSL certificate directory
  ansible.builtin.file:
    path: "{{ reach_dev_dir }}/httpd"
    state: directory
    mode: "0755"

- name: Check if mkcert CA is already installed
  ansible.builtin.stat:
    path: "{{ lookup('env', 'HOME') }}/.local/share/mkcert/rootCA.pem"
  register: mkcert_ca_stat

- name: Install mkcert CA and add to browser trust store
  ansible.builtin.command: mkcert -install
  when: not mkcert_ca_stat.stat.exists
  register: mkcert_install
  changed_when: mkcert_install.rc == 0

- name: Check if certificates already exist
  ansible.builtin.stat:
    path: "{{ reach_dev_dir }}/httpd/ssl.crt"
  register: ssl_cert_stat

- name: Generate SSL certificates for rch.local domains
  become: false
  ansible.builtin.command:
    cmd: mkcert -cert-file {{ reach_dev_ssl_cert_file }} -key-file {{ reach_dev_ssl_key_file }} rch.local *.rch.local
    creates: "{{ reach_dev_ssl_cert_file }}"
  when: not ssl_cert_stat.stat.exists
  register: mkcert_generate
  changed_when: mkcert_generate.rc == 0

- name: Set proper permissions on SSL certificate
  ansible.builtin.file:
    path: "{{ reach_dev_dir }}/httpd/ssl.crt"
    mode: "0644"

- name: Set proper permissions on SSL private key
  ansible.builtin.file:
    path: "{{ reach_dev_dir }}/httpd/ssl.key"
    mode: "0600"

- name: Display certificate information
  ansible.builtin.debug:
    msg: |
      mkcert SSL certificates have been configured for reach domains:

      Certificate files:
      - SSL Certificate: {{ reach_dev_dir }}/httpd/ssl.crt
      - SSL Private Key: {{ reach_dev_dir }}/httpd/ssl.key
      - CA Root: {{ lookup('env', 'HOME') }}/.local/share/mkcert/rootCA.pem

      Domains covered:
      - rch.local
      - *.rch.local (wildcard)

      The mkcert CA has been automatically installed in your system's browser trust store.
      Certificates are trusted by:
      - Chrome/Chromium
      - Firefox
      - Edge
      - Other browsers using system certificate store
