---
- name: Configure system timezone
  community.general.timezone:
    name: "{{ reach_timezone | default('UTC') }}"
  when: reach_timezone is defined

- name: Configure system locale
  when: ansible_distribution in ['Debian', 'Ubuntu']
  block:
    - name: Configure system locale
      ansible.builtin.package:
        name: locales
        state: present

    - name: Configure system locale
      community.general.locale_gen:
        name: "{{ locale_item }}"
        state: present
      loop: "{{ reach_locales | default(['en_US.UTF-8']) }}"
      loop_control:
        loop_var: locale_item

- name: Add local development hosts
  become: true
  ansible.builtin.blockinfile:
    path: /etc/hosts
    block: |
      {{ reach_hosts_marker }}
      {% for host in reach_dev_hosts %}
      127.0.0.1 {{ host }}
      {% endfor %}
    marker: "{{ reach_hosts_marker }} {mark}"
    create: false
    backup: "{{ reach_hosts_backup }}"
  when: reach_var | default('') != 'molecule_converge'
  notify: validate hosts
  tags:
    - reach
    - reach-host
    - hosts
    - network

- name: Check if Windows hosts file exists (WSL environment)
  ansible.builtin.stat:
    path: /mnt/c/Windows/System32/drivers/etc/hosts
  register: windows_hosts_file
  when:
    - reach_var | default('') != 'molecule_converge'
    - reach_dev_hosts is defined
    - reach_dev_hosts | length > 0
  tags:
    - reach
    - reach-host
    - hosts
    - network
    - windows

- name: Add local development hosts to Windows hosts file
  ansible.builtin.shell: |
    # Create a temporary file with the host entries
    temp_file=$(mktemp)
    echo "{{ reach_hosts_marker }}" > "$temp_file"
    {% for host in reach_dev_hosts %}
    echo "127.0.0.1 {{ host }}" >> "$temp_file"
    {% endfor %}
    echo "{{ reach_hosts_marker }}" >> "$temp_file"

    # Use gsudo to modify the Windows hosts file
    # First, remove any existing entries between our markers (inclusive)
    gsudo sed -i '/{{ reach_hosts_marker }}/,/{{ reach_hosts_marker }}/d' /mnt/c/Windows/System32/drivers/etc/hosts

    # Then append our new entries
    gsudo sh -c "cat '$temp_file' >> /mnt/c/Windows/System32/drivers/etc/hosts"

    # Clean up temp file
    rm "$temp_file"
  when:
    - reach_var | default('') != 'molecule_converge'
    - windows_hosts_file.stat.exists | default(false)
    - reach_dev_hosts is defined
    - reach_dev_hosts | length > 0
  changed_when: true
  tags:
    - reach
    - reach-host
    - hosts
    - network
    - windows
