---
- name: Reach-specific Tool Test
  hosts: all
  gather_facts: true
  become: true
  vars:
    # Test user configuration
    reach_test_user: testuser
    reach_test_home: /home/testuser

    # Override reach directory structure for testing
    sysinit_reach_base_dir: "{{ reach_test_home }}/withreach"
    sysinit_reach_dev_dir: "{{ reach_test_home }}/withreach/dev"
    sysinit_reach_repos_dir: "{{ reach_test_home }}/withreach/dev/repos"
    sysinit_reach_v2_dir: "{{ reach_test_home }}/withreach/dev/repos/v2"

    # Override reach configuration files
    sysinit_reach_env_example: "{{ reach_test_home }}/withreach/dev/env.example"
    sysinit_reach_env_file: "{{ reach_test_home }}/withreach/dev/.env"
    sysinit_reach_config_local_sample: "{{ reach_test_home }}/withreach/dev/repos/v2/config_local.sample.yaml"
    sysinit_reach_config_local: "{{ reach_test_home }}/withreach/dev/repos/v2/config_local.yaml"

    # Override reach repository configuration
    sysinit_reach_repo_script: "{{ reach_test_home }}/withreach/bin/getRepos.sh"

    # Override reach sudoers file
    sysinit_reach_sudoers_file: "/etc/sudoers.d/{{ reach_test_user }}-reach"

    # Test dev hosts
    sysinit_reach_dev_hosts:
      - test.rch.local
      - api.test.rch.local

    # Set test environment variables
    ansible_env:
      HOME: "{{ reach_test_home }}"
      USER: "{{ reach_test_user }}"

  tasks:
    - name: Create test user for molecule testing
      ansible.builtin.user:
        name: "{{ reach_test_user }}"
        uid: 1000
        state: present
        shell: /bin/bash
        create_home: true
        home: "{{ reach_test_home }}"

    - name: Test reach tasks with environment variables
      environment:
        HOME: "{{ reach_test_home }}"
        USER: "{{ reach_test_user }}"
      vars:
        ansible_user_id: "{{ reach_test_user }}"
      block:
        - name: Create test user SSH directory
          ansible.builtin.file:
            path: "{{ reach_test_home }}/.ssh"
            state: directory
            mode: '0700'
            owner: "{{ reach_test_user }}"
            group: "{{ reach_test_user }}"

        - name: Generate SSH key for test user
          ansible.builtin.command: >
            ssh-keygen -t ed25519 -f "{{ reach_test_home }}/.ssh/id_ed25519" -N '' \
            -C "{{ reach_test_user }}@{{ ansible_hostname }}"
          become: true
          become_user: "{{ reach_test_user }}"
          args:
            creates: "{{ reach_test_home }}/.ssh/id_ed25519"

        - name: Create reach directory structure
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            mode: '0755'
            owner: "{{ reach_test_user }}"
            group: "{{ reach_test_user }}"
          loop:
            - "{{ sysinit_reach_base_dir }}"
            - "{{ sysinit_reach_dev_dir }}"
            - "{{ sysinit_reach_repos_dir }}"
            - "{{ reach_test_home }}/withreach/bin"

        - name: Create mock repository script
          ansible.builtin.copy:
            content: |
              #!/bin/bash
              echo "Mock repository script for reach testing"
              mkdir -p "{{ sysinit_reach_repos_dir }}/v2"
              echo "Mock repos created successfully"
            dest: "{{ sysinit_reach_repo_script }}"
            mode: '0755'
            owner: "{{ reach_test_user }}"
            group: "{{ reach_test_user }}"

        - name: Create reach sudoers configuration
          ansible.builtin.copy:
            content: |  # pragma: allowlist secret
              # Reach sudoers configuration for {{ reach_test_user }}
              {{ reach_test_user }} ALL=(ALL) NOPASSWD: ALL
            dest: "{{ sysinit_reach_sudoers_file }}"
            mode: '0440'
            validate: '/usr/sbin/visudo -cf %s'

        - name: Test reach host configuration (create local hosts file)
          ansible.builtin.copy:
            content: |
              # Local reach development hosts
              {% for host in sysinit_reach_dev_hosts %}
              127.0.0.1 {{ host }}
              {% endfor %}
            dest: "{{ reach_test_home }}/withreach/dev/local-hosts"
            owner: "{{ reach_test_user }}"
            group: "{{ reach_test_user }}"
            mode: '0644'
          when: sysinit_reach_dev_hosts is defined

        - name: Configure SELinux contexts for reach (if SELinux enabled)
          community.general.sefcontext:
            target: "{{ sysinit_reach_base_dir }}(/.*)?"
            setype: container_file_t
            state: present
          when: ansible_selinux is defined and ansible_selinux.status == "enabled"

        - name: Apply SELinux contexts (if SELinux enabled)
          ansible.builtin.command:
            cmd: restorecon -R "{{ sysinit_reach_base_dir }}"
          when: ansible_selinux is defined and ansible_selinux.status == "enabled"
          changed_when: false
