---
sysinit_debug: false
sysinit_force_update: false

sysinit_packages:
  - gcc
  - make
  - unzip
  - xclip
  - xsel
  - zip

sysinit_sys_tools:
  - mise
  - reach

sysinit_mise_plugins:
  - amazon-ecr-credential-helper
  - awscli
  - github-cli
  - granted
  - jq
  - mkcert
  - node
  - pre-commit
  - python@3.11
  - starship
  - usage

# Reach directory structure
sysinit_reach_base_dir: "{{ lookup('env', 'HOME') }}/withreach"
sysinit_reach_dev_dir: "{{ sysinit_reach_base_dir }}/dev"
sysinit_reach_repos_dir: "{{ sysinit_reach_dev_dir }}/repos"
sysinit_reach_v2_dir: "{{ sysinit_reach_repos_dir }}/v2"

# Reach repository configuration
sysinit_reach_devops_repo_url: "git@github.com:withreach/reach-devops.git"
sysinit_reach_devops_repo_branch: "master"
sysinit_reach_repo_script: "{{ sysinit_reach_base_dir }}/bin/getRepos.sh"
sysinit_reach_repo_timeout: 300  # seconds
sysinit_reach_repo_retries: 3

# Reach configuration files
sysinit_reach_env_example: "{{ sysinit_reach_dev_dir }}/env.example"
sysinit_reach_env_file: "{{ sysinit_reach_dev_dir }}/.env"
sysinit_reach_config_local_sample: "{{ sysinit_reach_v2_dir }}/config_local.sample.yaml"
sysinit_reach_config_local: "{{ sysinit_reach_v2_dir }}/config_local.yaml"

# Reach VSCode configuration
sysinit_reach_vscode_settings_example: "{{ sysinit_reach_v2_dir }}/.vscode/settings-example.json"
sysinit_reach_vscode_settings: "{{ sysinit_reach_v2_dir }}/.vscode/settings.json"
sysinit_reach_vscode_user_dir: "{{ ansible_env.HOME }}/.config/Code/User"

# Reach host configuration
sysinit_reach_hosts_marker: "# Local Development - Reach"
sysinit_reach_hosts_backup: true
sysinit_reach_dev_hosts:
  - admin.rch.local
  - admin-api.rch.local
  - checkout.rch.local
  - portal.rch.local
  - reports.rch.local
  - stash.rch.local
  - redirect.rch.local
  - vue.admin.rch.local

# Reach SSH configuration
sysinit_reach_ssh_key_types:
  - rsa
  - ed25519
sysinit_reach_ssh_config_backup: true

# Reach Git configuration
sysinit_reach_git_user_email: ""
sysinit_reach_git_user_name: ""
sysinit_reach_git_default_branch: "main"

# Reach sudoers configuration
sysinit_reach_sudoers_file: "/etc/sudoers.d/{{ ansible_user_id }}-reach"
sysinit_reach_sudoers_backup: true

# Reach SELinux configuration
sysinit_reach_selinux_enabled: "{{ ansible_selinux.status == 'enabled' if ansible_selinux is defined else false }}"
sysinit_reach_selinux_contexts:
  - path: "{{ sysinit_reach_base_dir }}"
    setype: "container_file_t"
    recurse: true

# AWS configuration
sysinit_aws_sso_role_suffix: "dev"

# Tool installation paths
sysinit_local_bin: "{{ lookup('env', 'HOME') }}/.local/bin"
sysinit_applications_dir: "/usr/share/applications"

# AUR user for Arch Linux (used for AUR package installations)
aur_user: "{{ lookup('env', 'USER') }}"
