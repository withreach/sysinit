---
# WSL Configuration - Manage /etc/wsl.conf for WSL environments
- name: WSL - Detect WSL environment
  ansible.builtin.stat:
    path: /proc/version
  register: proc_version_check
  tags:
    - wsl
    - setup
    - system
    - config

- name: WSL - Check if running in WSL
  ansible.builtin.shell: |
    grep -qi "microsoft\|wsl" /proc/version 2>/dev/null && echo "true" || echo "false"
  register: wsl_detected
  changed_when: false
  when: proc_version_check.stat.exists
  tags:
    - wsl
    - setup
    - system
    - config

- name: WSL - Configure /etc/wsl.conf
  when: 
    - proc_version_check.stat.exists
    - wsl_detected.stdout == "true"
  become: true
  tags:
    - wsl
    - config
    - system
    - setup
  block:
    - name: WSL - Create /etc/wsl.conf with proper configuration
      ansible.builtin.template:
        src: wsl.conf.j2
        dest: /etc/wsl.conf
        backup: true
        mode: '0644'
        owner: root
        group: root
      register: wsl_conf_result
      tags:
        - wsl
        - config
        - files

    - name: WSL - Display configuration status
      ansible.builtin.debug:
        msg:
          - "WSL configuration updated: {{ '/etc/wsl.conf' }}"
          - "Changes made: {{ wsl_conf_result.changed }}"
          - "Note: WSL restart may be required for some changes to take effect"
      when: wsl_conf_result is defined
      tags:
        - wsl
        - info

    - name: WSL - Validate configuration file
      ansible.builtin.shell: |
        if [ -f /etc/wsl.conf ]; then
          echo "WSL config file exists and is readable"
          wc -l /etc/wsl.conf
        else
          echo "WSL config file not found"
          exit 1
        fi
      register: wsl_validation
      changed_when: false
      failed_when: wsl_validation.rc != 0
      tags:
        - wsl
        - validate
        - config

    - name: WSL - Show validation results
      ansible.builtin.debug:
        msg:
          - "Validation: {{ wsl_validation.stdout_lines[0] }}"
          - "File size: {{ wsl_validation.stdout_lines[1] if wsl_validation.stdout_lines|length > 1 else 'Unknown' }}"
      when: wsl_validation is succeeded
      tags:
        - wsl
        - info
        - validate

    - name: WSL - Check if usbipd-win is already installed
      ansible.builtin.shell: |
        # Use PowerShell to check for usbipd installation to avoid UNC path issues with cmd.exe
        /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -Command "if (Test-Path 'C:\\Program Files\\usbipd-win\\usbipd.exe') { 'C:\\Program Files\\usbipd-win\\usbipd.exe' } else { 'not found' }"
      register: usbipd_check
      changed_when: false
      failed_when: false
      tags:
        - wsl
        - usbipd
        - check
        - windows

    - name: WSL - Check if winget is available for usbipd installation
      ansible.builtin.shell: |
        # Use PowerShell to check for winget to avoid UNC path issues with cmd.exe
        /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -Command "if (Get-Command winget -ErrorAction SilentlyContinue) { 'winget available' } else { 'not found' }"
      register: usbipd_winget_check
      changed_when: false
      failed_when: false
      when: usbipd_check.stdout == "not found" or "usbipd" not in usbipd_check.stdout
      tags:
        - wsl
        - usbipd
        - setup
        - windows
        - winget

    - name: WSL - Install usbipd-win via winget (interactive)
      ansible.builtin.shell: |
        /mnt/c/Windows/System32/cmd.exe /c "winget install --interactive --exact dorssel.usbipd-win"
      when: 
        - usbipd_check.stdout == "not found" or "usbipd" not in usbipd_check.stdout
        - usbipd_winget_check is succeeded
        - usbipd_winget_check.stdout != "not found" and "winget available" in usbipd_winget_check.stdout
        - sysinit_wsl_install_usbipd | default(true)
      register: usbipd_install
      changed_when: usbipd_install.rc == 0
      failed_when: usbipd_install.rc != 0 and "already installed" not in usbipd_install.stdout
      tags:
        - wsl
        - usbipd
        - install
        - windows
        - winget

    - name: WSL - Verify usbipd-win installation
      ansible.builtin.shell: |
        # Try to find usbipd using PowerShell to avoid UNC path issues with cmd.exe
        /mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -Command "if (Test-Path 'C:\\Program Files\\usbipd-win\\usbipd.exe') { 'C:\\Program Files\\usbipd-win\\usbipd.exe' } else { exit 1 }"
      register: usbipd_verify
      changed_when: false
      when: usbipd_install is defined and usbipd_install is changed
      tags:
        - wsl
        - usbipd
        - verify
        - windows

    - name: WSL - usbipd-win already installed
      ansible.builtin.debug:
        msg:
          - "usbipd-win is already installed"
          - "Location: {{ usbipd_check.stdout_lines | join(', ') }}"
          - "Note: Use 'usbipd list' on Windows host to see USB devices"
          - "Note: Use 'usbipd bind --busid X-X' to bind devices for WSL access"
      when: usbipd_check.stdout != "not found" and "usbipd" in usbipd_check.stdout
      tags:
        - wsl
        - usbipd
        - info
        - windows

    - name: WSL - usbipd-win installation result
      ansible.builtin.debug:
        msg:
          - "usbipd-win installation completed"
          - "Location: {{ usbipd_verify.stdout if usbipd_verify is defined else 'Installation completed' }}"
          - "Note: Use 'usbipd list' on Windows host to see USB devices"
          - "Note: Use 'usbipd bind --busid X-X' to bind devices for WSL access"
          - "Note: You may need to restart your terminal or WSL session"
      when: usbipd_install is defined and usbipd_install is changed
      tags:
        - wsl
        - usbipd
        - info
        - windows

    - name: WSL - Install usbip tools in WSL (Linux side)
      ansible.builtin.shell: |
        # Get the current kernel version for linux-tools
        kernel_version=$(uname -r | sed 's/-microsoft.*$//')
        
        # Try to install kernel-specific tools first
        if apt list --installed linux-tools-${kernel_version}* 2>/dev/null | grep -q linux-tools; then
          echo "Kernel-specific linux-tools already installed"
        else
          # Try to install the generic version or current available version
          if apt-cache search linux-tools-generic | grep -q linux-tools-generic; then
            apt-get update && apt-get install -y linux-tools-generic hwdata
          else
            # Fall back to trying common tools packages
            apt-get update && apt-get install -y usbutils hwdata || echo "usbip tools may not be available in this environment"
          fi
        fi
      become: true
      register: usbip_tools_install
      when: sysinit_wsl_install_usbip_tools | default(true)
      changed_when: "'already installed' not in usbip_tools_install.stdout"
      failed_when: false  # Don't fail if tools aren't available
      tags:
        - wsl
        - usbipd
        - install
        - linux
        - packages

    - name: WSL - usbip tools installation result
      ansible.builtin.debug:
        msg:
          - "USB/IP tools installation attempted"
          - "Result: {{ usbip_tools_install.stdout_lines | default(['Installation attempted']) | join(' ') }}"
          - "Note: usbip command availability depends on kernel support"
          - "Note: For WSL2, you may need to use 'usbipd attach' from Windows instead"
      when: usbip_tools_install is defined
      tags:
        - wsl
        - usbipd
        - info

    - name: WSL - Check if wsl-open is already installed
      ansible.builtin.stat:
        path: "{{ lookup('env', 'HOME') }}/.local/bin/wsl-open"
      register: wsl_open_check
      become: false
      tags:
        - wsl
        - wsl-open
        - check

    - name: WSL - Create .local/bin directory if it doesn't exist
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.local/bin"
        state: directory
        mode: '0755'
      when: 
        - not wsl_open_check.stat.exists
        - sysinit_wsl_install_wsl_open | default(true)
      become: false
      tags:
        - wsl
        - wsl-open
        - setup

    - name: WSL - Download wsl-open script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/4U6U57/wsl-open/master/wsl-open.sh
        dest: "{{ lookup('env', 'HOME') }}/.local/bin/wsl-open"
        mode: '0755'
        backup: true
      when: 
        - not wsl_open_check.stat.exists
        - sysinit_wsl_install_wsl_open | default(true)
      become: false
      register: wsl_open_download
      tags:
        - wsl
        - wsl-open
        - install
        - download

    - name: WSL - Verify wsl-open installation
      ansible.builtin.command:
        cmd: "{{ lookup('env', 'HOME') }}/.local/bin/wsl-open -h"
      register: wsl_open_verify
      changed_when: false
      failed_when: wsl_open_verify.rc != 0
      when: wsl_open_download is defined and (wsl_open_download is changed or wsl_open_check.stat.exists)
      become: false
      tags:
        - wsl
        - wsl-open
        - verify

    - name: WSL - wsl-open already installed
      ansible.builtin.debug:
        msg:
          - "wsl-open is already installed"
          - "Location: {{ lookup('env', 'HOME') }}/.local/bin/wsl-open"
          - "Usage: wsl-open [file|directory|url]"
          - "Note: Opens files/URLs with default Windows applications"
      when: wsl_open_check.stat.exists and (wsl_open_download is not defined or wsl_open_download is skipped)
      tags:
        - wsl
        - wsl-open
        - info

    - name: WSL - wsl-open installation result
      ansible.builtin.debug:
        msg:
          - "wsl-open installation completed"
          - "Location: {{ lookup('env', 'HOME') }}/.local/bin/wsl-open"
          - "Version: {{ wsl_open_verify.stdout_lines | select('match', '.*wsl-open.*') | first | default('unknown') }}"
          - "Usage: wsl-open [file|directory|url]"
          - "Note: Opens files/URLs with default Windows applications"
          - "Note: Use 'wsl-open -a' to associate with xdg-open"
      when: wsl_open_download is defined and wsl_open_download is changed
      tags:
        - wsl
        - wsl-open
        - info

    - name: WSL - Show customization options
      ansible.builtin.debug:
        msg:
          - "WSL Configuration Variables (all optional):"
          - "  sysinit_wsl_systemd: {{ sysinit_wsl_systemd | default('true (default)') }}"
          - "  sysinit_wsl_default_user: {{ sysinit_wsl_default_user | default(lookup('env', 'USER') + ' (default)') }}"
          - "  sysinit_wsl_automount_enabled: {{ sysinit_wsl_automount_enabled | default('true (default)') }}"
          - "  sysinit_wsl_automount_root: {{ sysinit_wsl_automount_root | default('/mnt (default)') }}"
          - "  sysinit_wsl_interop_enabled: {{ sysinit_wsl_interop_enabled | default('true (default)') }}"
          - "  sysinit_wsl_interop_append_path: {{ sysinit_wsl_interop_append_path | default('true (default)') }}"
          - "  sysinit_wsl_install_usbipd: {{ sysinit_wsl_install_usbipd | default('true (default)') }}"
          - "  sysinit_wsl_install_usbip_tools: {{ sysinit_wsl_install_usbip_tools | default('true (default)') }}"
          - "  sysinit_wsl_install_wsl_open: {{ sysinit_wsl_install_wsl_open | default('true (default)') }}"
          - "To customize, set these variables in your playbook or inventory."
      tags:
        - wsl
        - info
        - help

- name: WSL - Skip configuration (not in WSL environment)
  ansible.builtin.debug:
    msg: "WSL configuration skipped - not running in WSL environment"
  when: 
    - not proc_version_check.stat.exists or wsl_detected.stdout != "true"
  tags:
    - wsl
    - info
    - skip