---
# =============================================================================
# REACH-SPECIFIC USER CONFIGURATION
# Only deploys .profile.d/reach and .aws/config files
# =============================================================================

- name: Ensure .profile.d directory exists
  become: false
  ansible.builtin.file:
    path: "/home/{{ lookup('env', 'USER') }}/.profile.d"
    state: directory
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
    mode: '0755'

- name: Ensure .aws directory exists
  become: false
  ansible.builtin.file:
    path: "/home/{{ lookup('env', 'USER') }}/.aws"
    state: directory
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
    mode: '0755'

- name: Deploy reach profile configuration
  become: false
  ansible.builtin.template:
    src: "skel/.profile.d/reach"
    dest: "/home/{{ lookup('env', 'USER') }}/.profile.d/reach"
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
    mode: '0644'

- name: Deploy reach AWS configuration
  become: false
  ansible.builtin.template:
    src: "skel/.aws/config"
    dest: "/home/{{ lookup('env', 'USER') }}/.aws/config"
    owner: "{{ lookup('env', 'USER') }}"
    group: "{{ lookup('env', 'USER') }}"
    mode: '0644'
