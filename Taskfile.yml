---
version: "3"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list-all

  check:
    desc: Run all pre-commit checks
    cmds:
      - pre-commit run --all-files

  lint:
    desc: Lint shell scripts
    cmds:
      - find . -name "*.sh" -type f | xargs shellcheck -e SC1091

  install:hooks:
    desc: Install pre-commit hooks
    cmds:
      - pre-commit install
